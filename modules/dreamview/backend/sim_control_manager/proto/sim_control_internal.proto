syntax = "proto2";

package apollo.sim_control;

import "modules/common_msgs/basic_msgs/header.proto";

enum SimControlSpawnMode {
    SIM_CONTROL_SPAWN_MODE_UNKNOWN = 0;
    SIM_CONTROL_SPAWN_MODE_LEGACY = 1;
    SIM_CONTROL_SPAWN_MODE_EXPLICIT_START = 2;
    SIM_CONTROL_SPAWN_MODE_LOCALIZATION_START = 3;
    SIM_CONTROL_SPAWN_MODE_ROUTING_START = 4;
}

enum SimControlPredictionMode {
    SIM_CONTROL_PREDICTION_MODE_UNKNOWN = 0;
    SIM_CONTROL_PREDICTION_MODE_LEGACY = 1;
    SIM_CONTROL_PREDICTION_MODE_EMPTY = 2;
    SIM_CONTROL_PREDICTION_MODE_CUSTOM_FILE = 3;
    SIM_CONTROL_PREDICTION_MODE_EXTERNAL_PASSTHROUGH = 4;
}

enum SimControlStartSource {
    SIM_CONTROL_START_SOURCE_UNKNOWN = 0;
    SIM_CONTROL_START_SOURCE_NONE = 1;
    SIM_CONTROL_START_SOURCE_EXPLICIT = 2;
    SIM_CONTROL_START_SOURCE_LOCALIZATION = 3;
    SIM_CONTROL_START_SOURCE_MAP_DEFAULT = 4;
    SIM_CONTROL_START_SOURCE_ROUTING_REQUEST = 5;
}

message SimCarStatus {
    optional double x = 1;                      // pos x in meters.
    optional double y = 2;                      // pos y in meters.
    optional double z = 3;                      // pos z in meters.
    optional double s = 4;                      // pos l in meters, reference to SL-coordinate
    optional double l = 5;                      // pos s in meters, reference to SL-coordinate
    optional double speed = 6;                  // speed, in m/s
    optional double acceleration_s = 7;         // acceleration in s direction
    optional double curvature = 8;              // curvature (k = 1/r), unit: (1/meters)
    optional double curvature_change_rate = 9;  // change of curvature in unit s (dk/ds)
    optional double relative_time = 10;         // in seconds relative time (relative_time = time_of_this_state - timestamp_in_header)
    optional double theta = 11;                 // relative to absolute coordinate system
    optional double accumulated_s = 12;         // calculated from the first point in this trajectory
    optional float odometer = 13;               // current odometer
    optional double angular_speed = 14;         // relative to absolute coordinate system
    optional int32 gear_position = 15;          // gear position from control command, 1:forward, 0:neural, -1:backward
}

message SimControlData {
   optional apollo.common.Header header = 1;
   optional SimCarStatus sim_car_status = 2;
}

message SimControlStatus {
   optional apollo.common.Header header = 1;
   optional bool enabled = 2;
   optional string dynamic_model_name = 3;
   optional SimControlSpawnMode configured_spawn_mode = 4;
   optional SimControlPredictionMode configured_prediction_mode = 5;
   optional SimControlStartSource last_start_source = 6;
   optional bool waiting_for_routing_start = 7;
   optional bool route_start_applied = 8;
   optional bool sim_control_timer_started = 9;
   optional bool publishing_prediction = 10;
   optional bool publishing_empty_prediction = 11;
   optional bool publishing_custom_prediction = 12;
   optional uint32 custom_prediction_obstacle_count = 13;
   optional string custom_prediction_file = 14;
   optional uint32 last_routing_waypoint_count = 15;
   optional uint32 last_routing_sequence_num = 16;
   optional string last_routing_module_name = 17;
   optional string status_message = 18;
   optional double start_x = 19;
   optional double start_y = 20;
   optional double start_theta = 21;
   optional double current_x = 22;
   optional double current_y = 23;
   optional double current_theta = 24;
}
