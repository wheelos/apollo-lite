syntax = "proto2";

package apollo.control;

import "wheelos_msgs/chassis_msgs/chassis.proto";
import "wheelos_msgs/control_msgs/pad_msg.proto";
import "modules/control/proto/lat_controller_conf.proto";
import "modules/control/proto/lon_controller_conf.proto";
import "modules/control/proto/mpc_controller_conf.proto";
import "modules/control/proto/diff_drive_lat_controller_conf.proto";
import "modules/control/proto/pid_conf.proto";

enum ControllerParameterProfile {
  CONTROL_PROFILE_ROAD_TRACKING = 0;
  CONTROL_PROFILE_LOW_SPEED_PRECISION = 1;
  CONTROL_PROFILE_STANDSTILL_HOLD = 2;
}

// Local tuning only. Vehicle models, actuator calibration and completion
// conditions are inherited unchanged from the platform/execution contract.
message ControllerTuningProfile {
  optional bool inherit_base_tuning = 1 [default = false];
  repeated ControlConf.ControllerType active_controllers = 2;
  repeated double lateral_q = 3;
  repeated double lateral_reverse_q = 4;
  optional PidConf station_pid = 5;
  optional PidConf low_speed_pid = 6;
  optional PidConf high_speed_pid = 7;
  optional PidConf reverse_station_pid = 8;
  optional PidConf reverse_speed_pid = 9;
  repeated double mpc_q = 10;
  repeated double mpc_r = 11;
  optional double max_entry_speed_mps = 12;
}

message ControllerProfiles {
  optional string version = 1;
  optional double max_switch_speed_mps = 2;
  optional ControllerTuningProfile road_tracking = 3;
  optional ControllerTuningProfile low_speed_precision = 4;
  optional ControllerTuningProfile standstill_hold = 5;
}

// Explicit opt-in. Every field is required by runtime validation. Physical
// acceleration/curvature and footprint bounds also come from VehicleParam.
message PrimitiveExecutionConf {
  optional double max_speed_mps = 1;
  optional double max_acceleration_mps2 = 2;
  optional double max_deceleration_mps2 = 3;
  optional double max_jerk_mps3 = 4;
  optional double max_curvature_per_m = 5;
  optional double max_curvature_derivative_per_m2 = 6;
  optional double max_lateral_acceleration_mps2 = 7;
  optional double footprint_margin_m = 8;
  optional double sample_period_sec = 9;
  optional double spatial_step_m = 10;
  optional double max_state_age_sec = 11;
  optional double max_tracking_heading_error_rad = 12;
}

message ControlConf {
  enum ControllerType {
    LAT_CONTROLLER = 0;
    LON_CONTROLLER = 1;
    MPC_CONTROLLER = 2;
    LON_SPEED_CONTROLLER = 3;
    DIFF_DRIVE_LAT_CONTROLLER = 4;
  };

  // configs from gflags
  optional double control_test_duration = 1 [default = -1];
  optional bool enable_speed_station_preview = 3 [default = false];
  optional bool is_control_test_mode = 4 [default = false];
  optional bool use_preview_speed_for_table = 5 [default = false];
  optional bool enable_input_timestamp_check = 6 [default = false];
  optional int32 max_localization_miss_num = 7 [default = 20];
  optional int32 max_chassis_miss_num = 8 [default = 20];
  optional int32 max_planning_miss_num = 9 [default = 20];
  optional double max_acceleration_when_stopped = 10 [default = 0.01];
  optional double steer_angle_rate = 11 [default = 100];
  optional bool enable_gain_scheduler = 12 [default = true];
  optional bool set_steer_limit = 13 [default = true];
  optional bool enable_slope_offset = 14 [default = false];
  optional double lock_steer_speed = 15 [default = 0.081];
  optional bool enable_navigation_mode_error_filter = 16 [default = false];
  optional bool enable_navigation_mode_position_update = 17 [default = true];
  optional bool enable_persistent_estop = 18 [default = true];

  // original config
  optional double control_period = 19;
  optional double max_planning_interval_sec = 20;
  optional double max_planning_delay_threshold = 21;
  // 0 - manual; 1 - auto_drive; 2 - speed_only; 3 - steer_only
  optional apollo.canbus.Chassis.DrivingMode driving_mode = 22;
  // 0: stop, at first should stop, then receive pad msg to start
  optional apollo.control.DrivingAction action = 23;
  optional double soft_estop_brake = 24;
  repeated ControllerType active_controllers = 25;
  optional int32 max_steering_percentage_allowed = 26;
  optional double max_status_interval_sec = 27;

  optional apollo.control.LatControllerConf lat_controller_conf = 28;
  optional apollo.control.LonControllerConf lon_controller_conf = 29;
  optional apollo.control.DiffDriveLatControllerConf diff_drive_lat_controller_conf = 40;

  optional double trajectory_period = 30;
  optional double chassis_period = 31;
  optional double localization_period = 32;

  optional double minimum_speed_resolution = 33;

  optional apollo.control.MPCControllerConf mpc_controller_conf = 34;

  optional double query_relative_time = 35;
  optional double minimum_speed_protection = 36;

  optional double max_path_remain_when_stopped = 37 [default = 0.3];
  optional double low_speed_approach_distance = 38;
  optional double low_speed_approach_speed = 39;
  optional PrimitiveExecutionConf primitive_execution = 41;
  // Absent preserves the fixed legacy controller set. Precision tuning is
  // opt-in, not inferred from a Mission task name or scene.
  optional ControllerProfiles controller_profiles = 42;
}
