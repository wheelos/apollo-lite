syntax = "proto2";

package apollo.common;

import "wheelos_msgs/chassis_msgs/chassis.proto";
import "wheelos_msgs/localization_msgs/pose.proto";

enum ReferencePoint {
  REAR_AXLE_CENTER = 0;
  FRONT_AXLE_CENTER = 1;
  CENTER_OF_MASS = 2;
}

enum TravelDirection {
  TRAVEL_DIRECTION_UNKNOWN = 0;
  TRAVEL_DIRECTION_FORWARD = 1;
  TRAVEL_DIRECTION_REVERSE = 2;
}

message VehicleState {
  optional double x = 1 [default = 0.0];
  optional double y = 2 [default = 0.0];
  optional double z = 3 [default = 0.0];
  optional double timestamp = 4 [default = 0.0];
  optional double roll = 5 [default = 0.0];
  optional double pitch = 6 [default = 0.0];
  optional double yaw = 7 [default = 0.0];
  optional double heading = 8 [default = 0.0];
  optional double kappa = 9 [default = 0.0];
  optional double linear_velocity = 10 [default = 0.0];
  optional double angular_velocity = 11 [default = 0.0];
  optional double linear_acceleration = 12 [default = 0.0];
  optional apollo.canbus.Chassis.GearPosition gear = 13;
  optional apollo.canbus.Chassis.DrivingMode driving_mode = 14;
  optional apollo.localization.Pose pose = 15;
  optional double steering_percentage = 16;
  optional ReferencePoint reference_point = 17
      [default = REAR_AXLE_CENTER];
}

message ReferenceState {
  optional ReferencePoint reference_point = 1;
  optional double x = 2 [default = 0.0];
  optional double y = 3 [default = 0.0];
  optional double z = 4 [default = 0.0];
  optional double heading = 5 [default = 0.0];
  optional double linear_velocity = 6 [default = 0.0];
  optional double angular_velocity = 7 [default = 0.0];
  optional double linear_acceleration = 8 [default = 0.0];
  optional double kappa = 9 [default = 0.0];
  optional double timestamp = 11 [default = 0.0];
  reserved 10, 12, 13, 14;
}

message VehicleOperatingState {
  optional double timestamp = 1 [default = 0.0];
  optional apollo.canbus.Chassis.GearPosition gear = 2;
  optional apollo.canbus.Chassis.DrivingMode driving_mode = 3;
  optional TravelDirection travel_direction = 4
      [default = TRAVEL_DIRECTION_UNKNOWN];
  optional double steering_percentage = 5;
}
