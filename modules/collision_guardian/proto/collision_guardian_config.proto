syntax = "proto2";

package apollo.collision_guardian;

import "modules/collision_guardian/proto/collision_guardian.proto";

message CollisionGuardianConfig {
  optional string vehicle_frame_id = 1 [default = "base_link"];
  optional string pointcloud_topic = 2;
  optional string occupancy_grid_topic = 3;
  optional string output_topic = 4
      [default = "/apollo/collision_guardian/risk"];
  optional bool enable_pointcloud = 5 [default = true];
  optional bool enable_occupancy_grid = 6 [default = false];
  optional UseCase use_case = 7 [default = USE_CASE_UNKNOWN];

  // All dimensions are non-negative lengths in the vehicle frame.
  optional double ego_forward_m = 10 [default = 2.5];
  optional double ego_backward_m = 11 [default = 2.2];
  optional double ego_half_width_m = 12 [default = 1.1];
  optional double roi_forward_m = 13 [default = 3.0];
  optional double roi_backward_m = 14 [default = 1.0];
  optional double roi_half_width_m = 15 [default = 1.2];
  optional double min_height_m = 16 [default = -0.1];
  optional double max_height_m = 17 [default = 2.0];
  optional bool y_axis_is_forward = 18 [default = false];

  optional double voxel_size_x_m = 20 [default = 0.1];
  optional double voxel_size_y_m = 21 [default = 0.1];
  optional double voxel_size_z_m = 22 [default = 0.1];
  optional double occupied_probability_threshold = 23 [default = 0.5];
  optional uint32 min_occupied_voxels = 24 [default = 5];

  optional double prior_probability = 30 [default = 0.1];
  optional double hit_probability = 31 [default = 0.7];
  optional double miss_probability = 32 [default = 0.3];
  optional double temporal_decay = 33 [default = 0.9];
  optional double suspected_probability = 34 [default = 0.5];
  optional double trigger_probability = 35 [default = 0.8];
  optional double release_probability = 36 [default = 0.3];
  optional uint32 min_confirmation_frames = 37 [default = 3];
  optional uint32 min_release_frames = 38 [default = 3];
  optional double input_stale_timeout_sec = 39 [default = 0.5];
  optional double transform_timeout_sec = 40 [default = 0.01];
}
