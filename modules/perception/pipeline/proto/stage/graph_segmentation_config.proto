syntax = "proto2";

package apollo.perception.lidar;

message GraphSegmentationConfig {
  optional uint32 grid_width = 1;
  optional uint32 grid_height = 2;
  optional float resolution = 3 [default = 0.6];
  optional float threshold = 4 [default = 2.0];
  optional uint32 min_pt_number = 5 [default = 60];
  optional uint32 search_radius = 6 [default = 2];
  optional float height_threshold = 7 [default = 2.0];
  optional float xmin = 8 [default = -10.0];
  optional float xmax = 9 [default = 10.0];
  optional float ymin = 10 [default = -10.0];
  optional float ymax = 11 [default = 10.0];
  optional float semantic_cost = 12 [default = 1.0];
  optional float car_xmin = 13 [default = -0.35];
  optional float car_xmax = 14 [default = 0.35];
  optional float car_ymin = 15 [default = -0.45];
  optional float car_ymax = 16 [default = 0.45];
  optional float car_zmax = 17 [default = 0.56];
  optional float min_radius = 18 [default = 0.5];
  optional float z_min_from_ground = 19 [default = 0.05];
  // split params
  optional float split_aspect_ratio = 21 [default = 15.0];
  optional float split_distance = 22 [default = 5.0];
}
