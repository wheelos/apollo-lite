syntax = "proto2";

package apollo.camera_semantic_segmentation;

import "wheelos_msgs/basic_msgs/header.proto";

enum CityscapesSemanticLabel {
  CITYSCAPES_ROAD = 0;
  CITYSCAPES_SIDEWALK = 1;
  CITYSCAPES_BUILDING = 2;
  CITYSCAPES_WALL = 3;
  CITYSCAPES_FENCE = 4;
  CITYSCAPES_POLE = 5;
  CITYSCAPES_TRAFFIC_LIGHT = 6;
  CITYSCAPES_TRAFFIC_SIGN = 7;
  CITYSCAPES_VEGETATION = 8;
  CITYSCAPES_TERRAIN = 9;
  CITYSCAPES_SKY = 10;
  CITYSCAPES_PERSON = 11;
  CITYSCAPES_RIDER = 12;
  CITYSCAPES_CAR = 13;
  CITYSCAPES_TRUCK = 14;
  CITYSCAPES_BUS = 15;
  CITYSCAPES_TRAIN = 16;
  CITYSCAPES_MOTORCYCLE = 17;
  CITYSCAPES_BICYCLE = 18;
  CITYSCAPES_UNKNOWN = 19;
}

message ImagePreprocessConfig {
  optional uint32 width = 1 [default = 1024];
  optional uint32 height = 2 [default = 512];
  repeated float channel_mean = 3;
  repeated float channel_std = 4;
  optional bool to_rgb = 5 [default = true];
}

message TensorConfig {
  optional string input_tensor_name = 1 [default = "input"];
  optional string output_tensor_name = 2 [default = "output"];
  optional uint32 num_classes = 3 [default = 19];
  optional string output_layout = 4 [default = "NCHW"];
}

message CameraSemanticSegmentationComponentConfig {
  optional string engine_path = 1;
  optional int32 gpu_device_id = 2 [default = 0];
  optional string camera_name = 3 [default = "front_6mm"];
  optional string source_topic = 4;
  optional string output_channel = 5
      [default = "/perception/camera_semantic_segmentation"];
  optional ImagePreprocessConfig preprocess = 6;
  optional TensorConfig tensor = 7;
}

message CameraSemanticSegmentationResult {
  optional apollo.common.Header header = 1;
  optional string source_topic = 2;
  optional string source_frame_id = 3;
  optional string camera_name = 4;
  optional uint32 width = 5;
  optional uint32 height = 6;
  optional uint32 num_classes = 7;
  optional bytes mask = 8;
  repeated uint32 pixel_labels = 9 [packed = true];
  repeated float pixel_confidences = 10 [packed = true];
}
