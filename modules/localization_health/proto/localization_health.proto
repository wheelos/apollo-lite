syntax = "proto2";

package apollo.localization;

import "wheelos_msgs/basic_msgs/header.proto";

enum AvailabilityState {
  AVAILABILITY_UNKNOWN = 0;
  AVAILABILITY_INITIALIZING = 1;
  AVAILABILITY_NOMINAL = 2;
  AVAILABILITY_DEGRADED = 3;
  AVAILABILITY_INVALID = 4;
}

enum RecoveryPhase {
  RECOVERY_IDLE = 0;
  RECOVERY_DETECTING = 1;
  RECOVERY_RELOCALIZING = 2;
  RECOVERY_ALIGNING = 3;
  RECOVERY_VERIFYING = 4;
  RECOVERY_FAILED = 5;
}

enum Capability {
  CAPABILITY_NONE = 0;
  LOCAL_POSE_VALID = 1;                // 1 << 0
  LOCAL_POSE_CONTINUOUS = 2;           // 1 << 1
  VELOCITY_VALID = 4;                  // 1 << 2
  HEADING_VALID = 8;                   // 1 << 3
  GLOBAL_POSE_VALID = 16;              // 1 << 4
  MAP_ALIGNED = 32;                    // 1 << 5
  LANE_LEVEL_VALID = 64;               // 1 << 6
  SHORT_TERM_PREDICTION_VALID = 128;   // 1 << 7
  RELOCALIZATION_AVAILABLE = 256;      // 1 << 8
}

enum HealthReason {
  REASON_NONE = 0;

  // Time & Comm (1-19)
  REASON_ASSESSMENT_TIMEOUT = 1;
  REASON_POSE_TIMEOUT = 2;
  REASON_TIMESTAMP_REGRESSION = 3;
  REASON_DATA_TOO_OLD = 4;
  REASON_SEQUENCE_ERROR = 5;
  REASON_SESSION_CHANGED = 6;
  REASON_TIME_SYNC_ERROR = 7;

  // Numerical & Output Integrity (20-39)
  REASON_NON_FINITE_OUTPUT = 20;
  REASON_INVALID_QUATERNION = 21;
  REASON_INVALID_COVARIANCE = 22;
  REASON_KINEMATIC_VIOLATION = 23;
  REASON_UNDECLARED_POSE_JUMP = 24;
  REASON_ESTIMATOR_NOT_RUNNING = 25;
  REASON_ESTIMATOR_NOT_CONVERGED = 26;

  // Local Localization (40-59)
  REASON_LOCAL_POSE_INVALID = 40;
  REASON_LIO_DIVERGED = 41;
  REASON_LIO_DEGENERATED = 42;
  REASON_IMU_SATURATION = 43;
  REASON_WHEEL_SLIP = 44;
  REASON_INSUFFICIENT_FEATURES = 45;

  // Global Localization & Map (60-79)
  REASON_GNSS_UNAVAILABLE = 60;
  REASON_GNSS_MULTIPATH = 61;
  REASON_GLOBAL_POSE_INVALID = 62;
  REASON_MAP_MATCH_FAILED = 63;
  REASON_MAP_MISMATCH = 64;
  REASON_MAP_STALE = 65;
  REASON_LANE_LEVEL_UNAVAILABLE = 66;

  // Recovery (80-99)
  REASON_RELOCALIZATION_REQUIRED = 80;
  REASON_RELOCALIZATION_AMBIGUOUS = 81;
  REASON_RELOCALIZATION_TIMEOUT = 82;
  REASON_RELOCALIZATION_FAILED = 83;
  REASON_GLOBAL_ALIGNMENT_IN_PROGRESS = 84;
  REASON_RECOVERY_VERIFICATION_FAILED = 85;
}

message SourceHealth {
  optional string source_name = 1;
  optional bool is_healthy = 2 [default = false];
  optional double last_seen_timestamp_sec = 3 [default = 0.0];
  optional uint32 fault_code = 4 [default = 0];
  optional string message = 5;
}

message LocalizationAssessment {
  optional apollo.common.Header header = 1;
  optional double timestamp_sec = 2;
  optional uint64 sequence = 3;
  optional string session_id = 4;

  optional bool estimator_running = 5 [default = false];
  optional bool estimator_converged = 6 [default = false];
  optional bool pose_valid = 7 [default = false];
  optional bool velocity_valid = 8 [default = false];
  optional bool heading_valid = 9 [default = false];

  optional bool covariance_valid = 10 [default = false];
  optional double position_std_x = 11 [default = 0.0];
  optional double position_std_y = 12 [default = 0.0];
  optional double position_std_z = 13 [default = 0.0];
  optional double yaw_std = 14 [default = 0.0];

  optional bool local_consistency_valid = 15 [default = false];
  optional bool map_alignment_valid = 16 [default = false];
  optional bool lane_level_valid = 17 [default = false];
  optional bool output_continuous = 18 [default = false];

  optional bool innovation_test_valid = 19 [default = false];
  optional bool innovation_passed = 20 [default = false];
  optional double map_match_score = 21 [default = 0.0];
  optional uint32 degeneracy_level = 22 [default = 0];

  optional bool correction_in_progress = 23 [default = false];
  optional RecoveryPhase relocalization_phase = 24 [default = RECOVERY_IDLE];
  optional uint32 relocalization_result = 25 [default = 0];

  optional uint64 active_algorithm_faults = 26 [default = 0];
  repeated SourceHealth source_health = 27;
}

message LocalizationHealthStatus {
  optional apollo.common.Header header = 1;
  optional double measurement_stamp = 2;
  optional double publish_stamp = 3;

  optional uint64 sequence = 4;
  optional string session_id = 5;
  optional uint64 transition_id = 6 [default = 0];
  optional uint32 interface_version = 7 [default = 1];
  optional uint64 configuration_hash = 8 [default = 0];

  optional AvailabilityState availability_state = 9 [default = AVAILABILITY_UNKNOWN];
  optional RecoveryPhase recovery_phase = 10 [default = RECOVERY_IDLE];

  optional uint64 capabilities = 11 [default = 0];
  optional uint64 active_reasons = 12 [default = 0];
  optional uint64 latched_reasons = 13 [default = 0];
  optional HealthReason primary_reason = 14 [default = REASON_NONE];

  optional float horizontal_uncertainty = 15 [default = 0.0];
  optional float vertical_uncertainty = 16 [default = 0.0];
  optional float heading_uncertainty = 17 [default = 0.0];

  optional float pose_age = 18 [default = 0.0];
  optional float assessment_age = 19 [default = 0.0];

  optional bool correction_in_progress = 20 [default = false];
  optional float remaining_position_correction = 21 [default = 0.0];
  optional float remaining_heading_correction = 22 [default = 0.0];
}

message LocalizationHealthEvent {
  optional apollo.common.Header header = 1;
  optional double stamp = 2;

  optional string session_id = 3;
  optional uint64 transition_id = 4 [default = 0];

  optional AvailabilityState previous_state = 5 [default = AVAILABILITY_UNKNOWN];
  optional AvailabilityState current_state = 6 [default = AVAILABILITY_UNKNOWN];
  optional RecoveryPhase recovery_phase = 7 [default = RECOVERY_IDLE];

  optional HealthReason primary_reason = 8 [default = REASON_NONE];
  optional uint64 active_reasons = 9 [default = 0];
}

message LocalizationHealthConfig {
  optional double pose_timeout_threshold = 1 [default = 0.1];
  optional double assessment_timeout_threshold = 2 [default = 0.1];
  optional double data_too_old_threshold = 3 [default = 0.5];
  optional double max_receive_age_threshold = 4 [default = 0.2];
  optional double max_linear_velocity = 5 [default = 45.0];
  optional double max_linear_acceleration = 6 [default = 10.0];
  optional double max_angular_velocity = 7 [default = 3.5];
  optional double pose_jump_threshold = 8 [default = 1.0];
  optional double yaw_jump_threshold = 9 [default = 0.35];
  optional double quaternion_norm_tolerance = 10 [default = 0.05];
  optional double recovery_duration_threshold = 11 [default = 1.0];
  optional double failure_debounce_duration = 12 [default = 0.1];
  optional double degraded_debounce_duration = 13 [default = 0.2];
  optional double nominal_horizontal_uncertainty_threshold = 14 [default = 0.2];
  optional double nominal_vertical_uncertainty_threshold = 15 [default = 0.5];
  optional double nominal_heading_uncertainty_threshold = 16 [default = 0.05];
  optional double nominal_map_match_score_threshold = 17 [default = 0.6];

  // Channel / Topic configs
  optional string localization_pose_topic = 18 [default = "/apollo/localization/pose"];
  optional string localization_assessment_topic = 19 [default = "/apollo/localization/assessment"];
  optional string localization_status_topic = 20 [default = "/apollo/localization/status"];
  optional string localization_event_topic = 21 [default = "/apollo/localization/event"];
}
