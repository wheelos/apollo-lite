syntax = "proto2";

package apollo.lidar_object_detection;

import "wheelos_msgs/basic_msgs/header.proto";

message PointPillarsComponentConfig {
  optional string engine_path = 1;
  optional string runtime_library_path = 2;
  optional int32 gpu_device_id = 3 [default = 0];
  optional string sensor_frame_id = 4;
  optional string output_channel = 5;
  optional float intensity_scale = 6;
  optional string model_revision = 7;
}

message PointPillarsObject {
  optional float center_x = 1;
  optional float center_y = 2;
  optional float center_z = 3;
  optional float size_x = 4;
  optional float size_y = 5;
  optional float size_z = 6;
  optional float yaw = 7;
  optional int32 class_id = 8;
  optional float score = 9;
}

message PointPillarsFrameResult {
  optional apollo.common.Header header = 1;
  optional string sensor_frame_id = 2;
  optional string model_revision = 3;
  repeated PointPillarsObject detection = 4;
  optional double inference_ms = 5;
}
