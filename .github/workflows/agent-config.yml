name: Documentation and agent configuration

on:
  pull_request:
    paths:
      - "**/*.md"
      - .agents/**
      - .github/workflows/agent-config.yml
      - apollo.doxygen
      - BUILD
      - products/**
      - tools/**/BUILD
      - tools/**/*.bzl
      - scripts/agents/**
      - scripts/ci/apollo_docs.sh
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .agents/**
      - .github/workflows/agent-config.yml
      - apollo.doxygen
      - BUILD
      - products/**
      - tools/**/BUILD
      - tools/**/*.bzl
      - scripts/agents/**
      - scripts/ci/apollo_docs.sh

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check portable configuration (external context not fetched)
        run: python3 scripts/agents/check.py
      - name: Test agent tooling contracts (not agent behavior)
        run: python3 -m unittest discover -s scripts/agents/tests -v
